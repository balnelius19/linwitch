<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mini Super Mario Land-like</title>
<style>
  :root { --scale: 3; --w: 320; --h: 180; }
  html, body { height: 100%; margin: 0; background:#1b1b1b; font-family: system-ui, sans-serif; color:#eee; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; }
  canvas {
    width: calc(var(--w) * 1px * var(--scale));
    height: calc(var(--h) * 1px * var(--scale));
    image-rendering: pixelated;
    background: linear-gradient(#86c5ff, #bfe1ff);
    outline: 2px solid #333;
  }
  #hud { width: calc(var(--w) * 1px * var(--scale)); display:flex; justify-content:space-between; font-weight:600; }
  #hud span { opacity:.9; }
  #hint { opacity:.7; font-size:12px; }
  a { color:#9bd; text-decoration:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="lives">Vies: 3</span>
    <span id="world">Monde 1‑1</span>
  </div>
  <canvas id="game" width="320" height="180"></canvas>
  <div id="hint">← → pour bouger • Espace/Z/W pour sauter • R pour recommencer</div>
</div>

<!-- Module 1: entities (player, enemy, collectibles, tiles, level) -->
<script type="module" id="entities">
export const TILE = 16;

export const T = {
  EMPTY: 0,
  GROUND: 1,
  BRICK: 2,
  BLOCK: 3,
  COIN: 4,
  SPIKE: 5,
  FLAG: 6
};

export const COLORS = {
  sky:   "#86c5ff",
  ground:"#7a5437",
  brick: "#b06f3b",
  block: "#c7b34b",
  coin:  "#ffd34d",
  spike: "#888",
  flag:  "#4ad66d"
};

// Simple level (width x height in tiles). Feel free to edit.
export const LEVEL = {
  w: 120, h: 12,
  data: (() => {
    const w = 120, h = 12;
    const arr = new Array(w*h).fill(0);
    const yGround = 10;

    // Ground
    for (let x=0; x<w; x++) {
      for (let y=yGround; y<h; y++) {
        arr[y*w + x] = T.GROUND;
      }
    }
    // Platforms / bricks / blocks
    const set = (x,y,t) => { if (x>=0&&x<w&&y>=0&&y<h) arr[y*w+x]=t; };
    // Some steps and platforms
    for (let i=0;i<6;i++) set(15+i, 9-i, T.BRICK);
    for (let i=0;i<5;i++) set(28+i, 7, T.BLOCK);
    for (let i=0;i<4;i++) set(44+i, 8, T.BRICK), set(44+i, 6, T.BLOCK);

    // Coin lines
    [20,21,22,23,24].forEach(x => set(x,5,T.COIN));
    [48,49,50].forEach(x => set(x,5,T.COIN));
    [64,65,66,67].forEach(x => set(x,4,T.COIN));

    // Spikes pit
    for (let x=70; x<76; x++) set(x,11,T.SPIKE);

    // More platforms
    [60,61,62].forEach(x => set(x,8,T.BRICK));
    [84,85,86,87].forEach(x => set(x,7,T.BLOCK));

    // Flag at the end
    set(118, 9, T.FLAG);
    set(118, 10, T.FLAG);
    set(118, 8, T.FLAG);

    return arr;
  })()
};

export function tileAt(map, x, y) {
  const tx = Math.floor(x / TILE);
  const ty = Math.floor(y / TILE);
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return T.GROUND; // treat out-of-bounds as solid
  return map.data[ty * map.w + tx] || 0;
}

export function isSolid(t) {
  return t === T.GROUND || t === T.BRICK || t === T.BLOCK;
}

export function isDeadly(t) {
  return t === T.SPIKE;
}

export function isPickup(t) {
  return t === T.COIN;
}

export function isFlag(t) {
  return t === T.FLAG;
}

export class Camera {
  constructor(w,h, worldW, worldH) {
    this.x = 0; this.y = 0;
    this.w = w; this.h = h;
    this.worldW = worldW; this.worldH = worldH;
  }
  follow(px, py) {
    const targetX = px - this.w/2;
    this.x = Math.max(0, Math.min(targetX, this.worldW - this.w));
    this.y = 0; // Side scroller fixed Y
  }
}

export class Rect {
  constructor(x,y,w,h){ this.x=x; this.y=y; this.w=w; this.h=h; }
  get left(){ return this.x; }
  get right(){ return this.x+this.w; }
  get top(){ return this.y; }
  get bottom(){ return this.y+this.h; }
  intersects(o){
    return !(this.right <= o.left || this.left >= o.right || this.bottom <= o.top || this.top >= o.bottom);
  }
}

export class Player extends Rect {
  constructor(x,y){
    super(x,y,14,16);
    this.vx=0; this.vy=0;
    this.speed = 0.12;
    this.maxVx = 1.2;
    this.jumpV = -5.0;
    this.onGround = false;
    this.anim = 0;
    this.facing = 1;
    this.invuln = 0;
    this.alive = true;
    this.score = 0;
    this.lives = 3;
  }
  applyInput(keys, dt){
    let ax = 0;
    if (keys.ArrowLeft) { ax = -this.speed; this.facing = -1; }
    if (keys.ArrowRight){ ax =  this.speed; this.facing =  1; }
    this.vx += ax * dt * 1000;
    this.vx *= 0.88; // friction
    this.vx = Math.max(-this.maxVx, Math.min(this.maxVx, this.vx));

    const wantJump = keys.Space || keys.KeyZ || keys.KeyW;
    if (wantJump && this.onGround){
      this.vy = this.jumpV;
      this.onGround = false;
    }
  }
  physics(dt, map){
    // gravity
    this.vy += 0.18 * dt * 60;
    if (this.vy > 3) this.vy = 3;

    // Horizontal move + collide
    this.x += this.vx * dt * 60;
    // sample along vertical span to collide horizontally
    const y1 = this.y+1, y2 = this.y+this.h-1;
    const stepY = Math.max(1, Math.floor(this.h/4));
    const signX = Math.sign(this.vx);
    for (let y=y1; y<=y2; y+=stepY) {
      const tx = signX>0 ? this.right : this.left;
      const t = tileAt(map, tx, y);
      if (isSolid(t)) {
        if (signX>0) this.x = Math.floor((this.right)/TILE)*TILE - this.w - 0.01;
        else this.x = Math.floor((this.left)/TILE+1)*TILE + 0.01;
        this.vx = 0;
        break;
      }
    }

    // Vertical move + collide
    this.y += this.vy * dt * 60;
    const x1 = this.x+2, x2 = this.x+this.w-2;
    const stepX = Math.max(1, Math.floor(this.w/4));
    const signY = Math.sign(this.vy);
    this.onGround = false;
    for (let x=x1; x<=x2; x+=stepX) {
      const ty = signY>0 ? this.bottom : this.top;
      const t = tileAt(map, x, ty);
      if (isSolid(t)) {
        if (signY>0) { // landing
          this.y = Math.floor((this.bottom)/TILE)*TILE - this.h - 0.01;
          this.onGround = true;
        } else { // head bump
          this.y = Math.floor((this.top)/TILE+1)*TILE + 0.01;
        }
        this.vy = 0;
        break;
      }
    }

    // Interactions: coins, spikes, flag
    this.handleTileInteractions(map);
    this.anim += (Math.abs(this.vx) + (this.onGround?0:0.2)) * dt * 60;
    if (this.invuln>0) this.invuln -= dt;
  }
  handleTileInteractions(map){
    const samples = [
      [this.left+2, this.top+2],
      [this.right-2, this.top+2],
      [this.left+2, this.bottom-2],
      [this.right-2, this.bottom-2]
    ];
    for (const [sx,sy] of samples){
      const tx = Math.floor(sx / TILE);
      const ty = Math.floor(sy / TILE);
      const idx = ty*map.w + tx;
      const t = map.data[idx];
      if (isPickup(t)){
        map.data[idx] = T.EMPTY;
        this.score += 100;
      } else if (isDeadly(t) && this.invuln<=0) {
        this.takeHit();
      }
    }
  }
  takeHit(){
    this.lives--;
    this.invuln = 2.0;
    if (this.lives <= 0) {
      this.alive = false;
    }
  }
  draw(ctx){
    // Flash while invulnerable
    const flash = this.invuln>0 && Math.floor(this.invuln*10)%2===0;
    if (flash) return;

    // Simple sprite: body + hat, facing
    ctx.save();
    ctx.translate(Math.floor(this.x), Math.floor(this.y));
    if (this.facing<0) { ctx.translate(this.w, 0); ctx.scale(-1,1); }

    // Body
    ctx.fillStyle = "#e25b45";
    ctx.fillRect(2, 4, 10, 12);
    // Head
    ctx.fillStyle = "#ffddc1";
    ctx.fillRect(3, 0, 8, 6);
    // Hat
    ctx.fillStyle = "#cc2a2a";
    ctx.fillRect(2, 0, 9, 3);
    // Feet animation
    const step = Math.sin(this.anim*0.4);
    ctx.fillStyle = "#3b2a1f";
    ctx.fillRect(2, 16-4, 4, 4);
    ctx.fillRect(8, 16-4 + (this.onGround? (step>0?1:0):0), 4, 4);

    ctx.restore();
  }
}

export class Enemy extends Rect {
  constructor(x,y){
    super(x,y,14,14);
    this.vx = -0.5;
    this.vy = 0;
    this.alive = true;
    this.bounce = 0;
  }
  update(dt, map){
    if (!this.alive) {
      this.vy += 0.2 * dt * 60;
      this.y += this.vy * dt * 60;
      return;
    }
    // gravity
    this.vy += 0.18 * dt * 60;
    if (this.vy > 3) this.vy = 3;

    // horizontal
    this.x += this.vx * dt * 60;
    // collide walls -> turn around
    const yMid = this.y + this.h/2;
    const tAhead = tileAt(map, this.vx>0? this.right+1 : this.left-1, yMid);
    if (isSolid(tAhead)) this.vx *= -1;

    // ensure floor
    const tBelow = tileAt(map, this.x+this.w/2, this.bottom+1);
    if (!isSolid(tBelow)) {
      // approaching a ledge -> turn
      this.vx *= -1;
    }

    // vertical collide ground/ceiling
    this.y += this.vy * dt * 60;
    const tBelow2 = tileAt(map, this.x+this.w/2, this.bottom);
    if (isSolid(tBelow2)) {
      this.y = Math.floor((this.bottom)/TILE)*TILE - this.h - 0.01;
      this.vy = 0;
    }
  }
  stomp(){
    this.alive = false;
    this.vy = -2;
  }
  draw(ctx){
    if (!this.alive) {
      ctx.save();
      ctx.translate(Math.floor(this.x), Math.floor(this.y));
      ctx.fillStyle = "#6b3a2d";
      ctx.fillRect(0, 0, this.w, this.h/2);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(Math.floor(this.x), Math.floor(this.y));
    ctx.fillStyle = "#7c553a";
    ctx.fillRect(0, 4, this.w, 10);
    ctx.fillStyle = "#3b2a1f";
    ctx.fillRect(2, 12, 4, 2);
    ctx.fillRect(8, 12, 4, 2);
    ctx.fillStyle = "#f0e7d8";
    ctx.fillRect(3, 0, 8, 4);
    ctx.restore();
  }
}

export function spawnEnemies() {
  return [
    new Enemy(32*TILE, 8*TILE),
    new Enemy(50*TILE, 8*TILE),
    new Enemy(90*TILE, 8*TILE),
  ];
}
</script>

<!-- Module 2: game engine (import entities dynamically from inline script) -->
<script type="module" id="game">
const ENTITIES_TEXT = document.getElementById('entities').textContent;
const entitiesURL = URL.createObjectURL(new Blob([ENTITIES_TEXT], { type: 'text/javascript' }));
const {
  TILE, T, COLORS, LEVEL, tileAt, isSolid, isFlag,
  Player, Enemy, Camera, spawnEnemies
} = await import(entitiesURL);

// Setup
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') resetLevel();
});
addEventListener('keyup',   e => keys[e.code] = false);

// World
let map, player, enemies, cam, state, flagReachedAt = 0;

function makeMapCopy(){
  return { w: LEVEL.w, h: LEVEL.h, data: LEVEL.data.slice() };
}

function resetLevel(){
  map = makeMapCopy();
  player = new Player(3*TILE, 7*TILE);
  // Preserve lives and score if restarting after death
  if (!state || state === 'init') {
    player.lives = 3;
    player.score = 0;
  } else {
    player.lives = Math.max(0, player.lives || 3);
    player.score = player.score || 0;
  }
  enemies = spawnEnemies();
  cam = new Camera(W, H, map.w * TILE, map.h * TILE);
  state = 'playing';
  flagReachedAt = 0;
}
resetLevel();

// Collision player vs enemies
function playerEnemyCollisions() {
  for (const e of enemies) {
    if (!e) continue;
    if (!e.alive && e.y > map.h*TILE) continue;
    const pr = {left:player.x, right:player.x+player.w, top:player.y, bottom:player.y+player.h};
    const er = {left:e.x, right:e.x+e.w, top:e.y, bottom:e.y+e.h};
    const intersect = !(pr.right<=er.left||pr.left>=er.right||pr.bottom<=er.top||pr.top>=er.bottom);
    if (!intersect) continue;

    const playerDownward = player.vy > 0 && (player.bottom - e.top) < 10;
    if (playerDownward) {
      e.stomp();
      player.vy = -2.2;
      player.score += 200;
    } else if (player.invuln <= 0) {
      player.takeHit();
      if (!player.alive) {
        state = 'dead';
      }
    }
  }
}

// Check flag / win condition
function checkFlag() {
  // sample feet center tile
  const t = tileAt(map, player.x + player.w/2, player.y + player.h/2);
  if (isFlag(t)) {
    if (state !== 'win') {
      state = 'win';
      flagReachedAt = performance.now();
      player.score += 1000;
    }
  }
}

// Render tiles
function drawMap() {
  const startX = Math.floor(cam.x / TILE);
  const endX = Math.ceil((cam.x + W) / TILE);
  const startY = Math.floor(cam.y / TILE);
  const endY = Math.ceil((cam.y + H) / TILE);

  for (let ty=startY; ty<endY; ty++) {
    for (let tx=startX; tx<endX; tx++) {
      const idx = ty*map.w + tx;
      const t = map.data[idx];
      if (!t) continue;
      const x = tx*TILE - cam.x;
      const y = ty*TILE - cam.y;

      switch (t) {
        case T.GROUND:
          ctx.fillStyle = COLORS.ground; ctx.fillRect(x, y, TILE, TILE);
          // texture
          ctx.fillStyle = "#68462e"; ctx.fillRect(x, y+TILE-3, TILE, 3);
          break;
        case T.BRICK:
          ctx.fillStyle = COLORS.brick; ctx.fillRect(x, y, TILE, TILE);
          ctx.strokeStyle="#7b3f1b"; ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
          break;
        case T.BLOCK:
          ctx.fillStyle = COLORS.block; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = "#8f7a2b"; ctx.fillRect(x+5, y+5, 6, 6);
          break;
        case T.COIN:
          // coin “floating”
          ctx.fillStyle = COLORS.coin;
          ctx.beginPath();
          ctx.ellipse(x+TILE/2, y+TILE/2, 4, 6, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = "#d4a83a"; ctx.fillRect(x+TILE/2-1, y+TILE/2-4, 2, 8);
          break;
        case T.SPIKE:
          ctx.fillStyle = COLORS.spike;
          ctx.beginPath();
          ctx.moveTo(x, y+TILE);
          ctx.lineTo(x+TILE/2, y+TILE-8);
          ctx.lineTo(x+TILE, y+TILE);
          ctx.closePath();
          ctx.fill();
          break;
        case T.FLAG:
          ctx.fillStyle = "#2e8b57";
          ctx.fillRect(x+TILE-3, y, 2, TILE);
          ctx.fillStyle = COLORS.flag;
          ctx.beginPath();
          ctx.moveTo(x+TILE-3, y+2);
          ctx.lineTo(x+TILE-3-10, y+6);
          ctx.lineTo(x+TILE-3, y+10);
          ctx.closePath();
          ctx.fill();
          break;
      }
    }
  }
}

// Parallax clouds
const clouds = Array.from({length: 8}, (_,i)=>({
  x: 40+i*80, y: 20 + (i%3)*18, w: 24+ (i%2)*10
}));

function drawBackground() {
  // light gradient already in CSS, add clouds relative to camera
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const c of clouds) {
    const cx = c.x - (cam.x * 0.4 % (map.w*TILE));
    const drawX = ((cx % (map.w*TILE)) + (map.w*TILE))%(map.w*TILE) - cam.x;
    ctx.beginPath();
    ctx.ellipse(drawX, c.y, c.w, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

// Game loop
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.033, (now - last)/1000);
  last = now;

  // Update
  if (state === 'playing') {
    player.applyInput(keys, dt);
    player.physics(dt, map);
    for (const e of enemies) e.update(dt, map);
    playerEnemyCollisions();
    checkFlag();
    cam.follow(player.x + player.w/2, player.y + player.h/2);
    if (player.y > (map.h+2)*TILE) { // fell
      player.takeHit();
      if (!player.alive) state='dead';
      else resetLevel();
    }
  } else if (state === 'win') {
    // small delay then reset with keep score/lives
    if (now - flagReachedAt > 1500) {
      const {score,lives} = player;
      resetLevel();
      player.score = score;
      player.lives = lives;
    }
    cam.follow(player.x + player.w/2, player.y + player.h/2);
  }

  // Render
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawMap();

  // Draw enemies
  for (const e of enemies) {
    ctx.save();
    ctx.translate(-cam.x, -cam.y);
    e.draw(ctx);
    ctx.restore();
  }

  // Draw player
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  player.draw(ctx);
  ctx.restore();

  // HUD
  scoreEl.textContent = "Score: " + player.score;
  livesEl.textContent = "Vies: " + player.lives;

  if (state === 'dead') {
    overlayText("Game Over — R pour recommencer");
  } else if (state === 'win') {
    overlayText("Course terminée ! +1000 points");
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function overlayText(t) {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, H/2-16, W, 32);
  ctx.fillStyle = "#fff";
  ctx.font = "12px monospace";
  ctx.textAlign = "center";
  ctx.fillText(t, W/2, H/2+4);
  ctx.restore();
}
</script>
</body>
</html>
